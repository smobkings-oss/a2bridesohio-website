<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passenger Sign Up | A2B Rides Ohio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: { 400: '#f5d76e', 500: '#d4af37', 600: '#b8860b' } }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050505; }
    .btn-gold { background: linear-gradient(135deg, #d4af37, #b8860b); }
  </style>
</head>
<body class="text-white antialiased">

  <nav class="border-b border-white/10 bg-black/95">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="font-bold text-gold-500">A2B RIDES</div>
        <div class="text-[10px] text-gray-400">OHIO</div>
      </a>
      <a href="index.html" class="text-sm text-gray-400">← Back to Home</a>
    </div>
  </nav>

  <div class="max-w-lg mx-auto px-4 py-10">
    <h1 class="text-3xl font-black mb-2">Passenger Sign Up</h1>
    <p class="text-gray-400 mb-8 text-sm">Verified riders only. Sign up with proper ID.</p>

    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 mb-6 text-sm">
      <h2 class="font-bold text-gold-500 mb-3">Why Verification?</h2>
      <ul class="text-xs text-gray-400 space-y-1.5 list-disc list-inside">
        <li>All riders must be approved</li>
        <li>Protects drivers and passengers</li>
        <li>Once verified, someone can send you a ride</li>
      </ul>
    </div>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" enctype="multipart/form-data" class="space-y-5">
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Full Legal Name *</label>
          <input type="text" name="full_name" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Phone *</label>
          <input type="tel" name="phone" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Email *</label>
          <input type="email" name="email" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Date of Birth *</label>
          <input type="date" name="dob" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-sm">
        </div>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
        <h3 class="font-bold text-gold-500 text-sm">Government ID (Front & Back – Clear)</h3>
        <div>
          <label class="block text-xs text-gray-400 mb-1">ID Front *</label>
          <input type="file" name="id_front" accept="image/*" required class="w-full text-sm text-gray-400">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">ID Back *</label>
          <input type="file" name="id_back" accept="image/*" required class="w-full text-sm text-gray-400">
        </div>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
        <label class="flex items-start gap-3 cursor-pointer text-sm">
          <input type="checkbox" name="agree" required class="accent-gold-500 w-4 h-4 mt-1">
          <span class="text-gray-300">I confirm my ID is accurate and I agree to A2B Rides passenger policies.</span>
        </label>
      </div>

      <button type="submit" class="w-full btn-gold text-black font-bold py-4 rounded-xl text-lg">
        Submit for Verification
      </button>
    </form>
  </div>
</body>
</html>
